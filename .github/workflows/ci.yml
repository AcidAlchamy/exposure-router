name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      # The measuring stick is part of CI: a routing change that moves the
      # numbers without an updated baseline fails here, on purpose.
      - run: npm run bench -- --check
